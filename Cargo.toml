[package]
name = "beforefx"
version = "1.2.4"
edition = "2024"

[dependencies]
# Use the exact same version egui-macroquad expects
macroquad = { version = "0.4.5", features = ["audio"] }
egui-macroquad = "0.17.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
playa-ffmpeg = { version = "8.0.3", features = ["static"] }
lz4_flex = "0.11"
